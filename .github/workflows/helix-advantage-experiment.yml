name: HELIX incremental advantage falsification
on:
  push:
    branches:
      - experiment/helix-advantage-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-experiment:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install bag reader
        run: python -m pip install 'rosbags==0.10.11'
      - name: Run original HELIX detector, diagnosis and safety-envelope against recorded GO2 data
        run: python experiments/helix_advantage_20261102/benchmark.py
      - name: Upload full individual trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-advantage-20261102
          if-no-files-found: warn
          path: experiments/helix_advantage_20261102/results.json
