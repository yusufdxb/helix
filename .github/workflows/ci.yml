name: CI

on:
  push:
    branches: [main, "arch/**"]
  pull_request:
    branches: [main]

jobs:
  core:
    name: Monitor core, ROS 2 node, gtest
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          apt-get update -q
          apt-get install -y python3-colcon-common-extensions ros-humble-ament-cmake-gtest ros-humble-rosidl-generator-dds-idl git
      - name: Unitree message packages (for the ROS node)
        run: |
          git clone --depth 1 https://github.com/unitreerobotics/unitree_ros2.git /tmp/unitree_ros2
          mkdir -p src/third_party
          cp -r /tmp/unitree_ros2/cyclonedds_ws/src/unitree/unitree_go /tmp/unitree_ros2/cyclonedds_ws/src/unitree/unitree_api src/third_party/
      - name: Build
        run: |
          . /opt/ros/humble/setup.sh
          colcon build --packages-up-to helix_monitor --cmake-args -DCMAKE_BUILD_TYPE=Release
          test -x install/helix_monitor/lib/helix_monitor/helix_monitor_node
          test -x install/helix_monitor/lib/helix_monitor/monitor_eval
      - name: Test
        run: |
          . /opt/ros/humble/setup.sh
          colcon test --packages-select helix_monitor
          colcon test-result --verbose

  lint:
    name: Lint eval (ruff)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check eval/ --select E,F,W --ignore E501
